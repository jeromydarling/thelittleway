<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 380" role="img" aria-label="A single rose, in memory of St Thérèse of Lisieux">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#fdfaf3" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f3ede0" stop-opacity="0.6"/>
    </radialGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9a5a3a"/>
      <stop offset="100%" stop-color="#6b4226"/>
    </linearGradient>
  </defs>

  <!-- Vesica piscis frame -->
  <ellipse cx="140" cy="190" rx="118" ry="170" fill="url(#bg)" stroke="#6b4226" stroke-opacity="0.35" stroke-width="1.25"/>
  <ellipse cx="140" cy="190" rx="106" ry="158" fill="none" stroke="#6b4226" stroke-opacity="0.18" stroke-width="0.6"/>

  <!-- Stem -->
  <path d="M140 245 C 142 220, 138 195, 140 160 C 141 140, 139 122, 140 105" fill="none" stroke="#6b4226" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Leaves -->
  <g fill="none" stroke="#6b4226" stroke-width="1.4" stroke-linecap="round">
    <path d="M140 218 C 120 214, 105 220, 95 232 C 110 234, 128 230, 140 222"/>
    <path d="M140 190 C 158 184, 174 188, 184 198 C 170 202, 152 198, 140 194"/>
    <path d="M140 160 C 124 154, 110 158, 102 170 C 116 172, 130 168, 140 164"/>
  </g>

  <!-- A small unopened bud -->
  <g transform="translate(168,140)">
    <ellipse cx="0" cy="0" rx="6" ry="9" fill="url(#petal)" opacity="0.85"/>
    <path d="M-5 6 C -6 12, 0 16, 0 20" fill="none" stroke="#6b4226" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M5 6 C 6 12, 0 16, 0 20" fill="none" stroke="#6b4226" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Main bloom: a stylized rose -->
  <g transform="translate(140,105)">
    <!-- outer petals -->
    <path d="M-26 6 C -32 -8, -22 -22, -8 -22 C 0 -28, 12 -26, 20 -16 C 30 -8, 28 6, 18 14 C 14 22, 4 24, -6 22 C -18 22, -28 16, -26 6 Z"
          fill="url(#petal)" opacity="0.85"/>
    <!-- inner petal layer -->
    <path d="M-16 2 C -18 -8, -10 -16, 0 -16 C 10 -18, 18 -10, 18 0 C 20 10, 12 16, 2 16 C -8 18, -18 12, -16 2 Z"
          fill="#7a4a2c" opacity="0.9"/>
    <!-- furl -->
    <path d="M-6 -2 C -2 -8, 6 -8, 8 -2 C 12 4, 6 10, -2 8 C -8 8, -10 2, -6 -2 Z"
          fill="#5a371d"/>
    <!-- highlight -->
    <path d="M-4 -4 C -2 -6, 2 -6, 3 -3" fill="none" stroke="#c89070" stroke-width="0.8" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Subtle ornament at base of frame -->
  <text x="140" y="335" text-anchor="middle" font-family="serif" font-size="14" fill="#6b4226" opacity="0.5">✣</text>
</svg>
